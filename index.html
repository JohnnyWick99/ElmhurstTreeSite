<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elmhurst University Trees</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home">
  <h1>Elmhurst University Trees</h1>

  <form id="search-form" class="search-form" autocomplete="off">
    <input
      id="tree-id"
      type="text"
      placeholder="Search by ID or name (e.g. 25 or Oak)"
      aria-label="Tree search"
      required
    >
    <button type="submit">Search</button>
  </form>

  <div id="search-results"></div>

  <section class="tree-list-section" aria-labelledby="tree-list-heading">
    <h2 id="tree-list-heading">All trees</h2>
    <table class="tree-list" id="tree-list">
      <thead>
        <tr>
          <th scope="col" class="col-id">ID</th>
          <th scope="col">Tree</th>
          <th scope="col">Dedication</th>
          <th scope="col">Age class</th>
        </tr>
      </thead>
      <tbody>
        <tr class="tree-list-status">
          <td colspan="4">Loading trees…</td>
        </tr>
      </tbody>
    </table>
  </section>

  <script src="db.js"></script>
  <script>
    (function () {
      function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function displayValue(v) {
        if (v === null || v === undefined) return '—';
        var s = String(v).trim();
        if (s === '' || s.toUpperCase() === 'N/A') return '—';
        return s;
      }

      // ── Search form ──────────────────────────────────────────────────────
      var form = document.getElementById('search-form');
      var input = document.getElementById('tree-id');
      var resultsDiv = document.getElementById('search-results');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var raw = input.value.trim();
        resultsDiv.innerHTML = '';
        input.classList.remove('invalid');

        if (!raw) {
          input.classList.add('invalid');
          return;
        }

        // 1. Try exact numeric ID lookup first
        var id = raw.replace(/^0+/, '') || raw;
        if (/^[0-9]+$/.test(id)) {
          TreeDB.hasTree(id).then(function (exists) {
            if (exists) {
              window.location.href = 'tree.html?id=' + encodeURIComponent(id);
            } else {
              input.classList.add('invalid');
              resultsDiv.innerHTML = '<p class="no-results">No tree found with that ID.</p>';
            }
          }).catch(function () {
            input.classList.add('invalid');
          });
          return;
        }

        // 2. Name / scientific name search using the full tree list
        TreeDB.listTrees().then(function (trees) {
          var query = raw.toLowerCase();
          var matches = trees.filter(function (t) {
            return (
              t.tree_name.toLowerCase().includes(query) ||
              (t.scientific_name && t.scientific_name.toLowerCase().includes(query))
            );
          });

          if (matches.length === 0) {
            input.classList.add('invalid');
            resultsDiv.innerHTML = '<p class="no-results">No trees found. Try a different ID or name.</p>';
          } else if (matches.length === 1) {
            window.location.href = 'tree.html?id=' + encodeURIComponent(matches[0].tree_id);
          } else {
            var items = matches.map(function (t) {
              var url = 'tree.html?id=' + encodeURIComponent(t.tree_id);
              return (
                '<li><a href="' + escapeHtml(url) + '">' +
                '#' + escapeHtml(t.tree_id) + ' — ' + escapeHtml(t.tree_name) +
                (t.scientific_name
                  ? ' <span class="sci-name">(' + escapeHtml(t.scientific_name) + ')</span>'
                  : '') +
                '</a></li>'
              );
            }).join('');
            resultsDiv.innerHTML =
              '<p>' + matches.length + ' trees found:</p><ul>' + items + '</ul>';
          }
        }).catch(function () {
          input.classList.add('invalid');
          resultsDiv.innerHTML = '<p class="no-results">Search failed. Please try again.</p>';
        });
      });

      input.addEventListener('input', function () {
        input.classList.remove('invalid');
        resultsDiv.innerHTML = '';
      });

      // ── All-trees table ──────────────────────────────────────────────────
      var tbody = document.querySelector('#tree-list tbody');

      TreeDB.listTrees().then(function (trees) {
        if (!trees || !trees.length) {
          tbody.innerHTML =
            '<tr class="tree-list-status"><td colspan="4">No trees found.</td></tr>';
          return;
        }

        var html = '';
        for (var i = 0; i < trees.length; i++) {
          var t = trees[i];
          var url = 'tree.html?id=' + encodeURIComponent(t.tree_id);
          html +=
            '<tr class="tree-row" data-href="' + escapeHtml(url) + '" tabindex="0">' +
              '<td class="col-id">' + escapeHtml(t.tree_id) + '</td>' +
              '<td><a class="tree-link" href="' + escapeHtml(url) + '">' +
                escapeHtml(t.tree_name) + '</a></td>' +
              '<td>' + escapeHtml(displayValue(t.dedication_type)) + '</td>' +
              '<td>' + escapeHtml(displayValue(t.age_class)) + '</td>' +
            '</tr>';
        }
        tbody.innerHTML = html;

        tbody.addEventListener('click', function (e) {
          if (e.target.closest('a')) return;
          var row = e.target.closest('tr.tree-row');
          if (row && row.dataset.href) {
            window.location.href = row.dataset.href;
          }
        });

        tbody.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          var row = e.target.closest('tr.tree-row');
          if (row && row.dataset.href) {
            window.location.href = row.dataset.href;
          }
        });
      }).catch(function () {
        tbody.innerHTML =
          '<tr class="tree-list-status"><td colspan="4">Failed to load trees.</td></tr>';
      });
    })();
  </script>
</body>
</html>
